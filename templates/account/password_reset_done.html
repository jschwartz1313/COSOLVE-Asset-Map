{% extends "base.html" %}
{% block title %}Check your email | COSOLVE{% endblock %}
{% block content %}
<main id="main-content" class="account-page">
  <section class="account-panel">
    <span class="eyebrow">Account recovery</span>
    <h1>Check your email</h1>
    <p>If an active account matches that address, a password reset message has been sent.</p>
    <a class="button secondary full" href="{% url 'account_login' %}">Return to sign in</a>
  </section>
</main>
{% endblock %}
