{% extends "base.html" %}
{% block title %}Change password | COSOLVE{% endblock %}
{% block content %}
<main id="main-content" class="account-page">
  <section class="account-panel">
    <span class="eyebrow">Account security</span>
    <h1>Change password</h1>
    <form method="post" action="{% url 'account_change_password' %}" class="stacked-form">
      {% csrf_token %}{{ form.non_field_errors }}
      {% for field in form %}<label><span>{{ field.label }}</span>{{ field }}{{ field.errors }}</label>{% endfor %}
      <button class="button primary full" type="submit">Update password</button>
    </form>
  </section>
</main>
{% endblock %}
