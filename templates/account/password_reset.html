{% extends "base.html" %}
{% block title %}Reset password | COSOLVE{% endblock %}
{% block content %}
<main id="main-content" class="account-page">
  <section class="account-panel">
    <span class="eyebrow">Account recovery</span>
    <h1>Reset your password</h1>
    <p>Enter the email address on your account. We will send a secure reset link.</p>
    <form method="post" action="{% url 'account_reset_password' %}" class="stacked-form">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label><span>Email address</span>{{ form.email }}{{ form.email.errors }}</label>
      <button class="button primary full" type="submit">Send reset link</button>
    </form>
    <div class="account-links"><a href="{% url 'account_login' %}">Return to sign in</a></div>
  </section>
</main>
{% endblock %}
