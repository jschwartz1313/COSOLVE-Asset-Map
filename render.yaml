databases:
  - name: cosolve-asset-map-db
    # Matches the existing paid database; retain its automatic recovery coverage.
    plan: basic-256mb
    databaseName: cosolve_asset_map
    user: cosolve_asset_map

services:
  - type: web
    name: cosolve-asset-map
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: bash start.sh
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: cosolve-asset-map-db
          property: connectionString
      - key: REQUIRE_SITE_LOGIN
        value: "true"
      - key: PUBLIC_REGION_SLUG
        value: ""
      - key: PUBLIC_SCOPE_NAME
        value: Virginia
      - key: DEFAULT_MAP_LAT
        value: "37.5"
      - key: DEFAULT_MAP_LON
        value: "-78.7"
      - key: DEFAULT_MAP_ZOOM
        value: "7"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
